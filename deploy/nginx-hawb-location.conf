    # ── HAWB 分单审核台对外入口（与 /ccsp/、/dsv/、/efreight/ 同一套反代惯例）──
    # 粘贴位置：/etc/nginx/sites-enabled/default 的 443 server 块内、`location / {` 之前；生效：nginx -t && systemctl reload nginx
    # 应用照惯例只绑回环 127.0.0.1:8020；页面按 location.pathname 自适应前缀（web/index.html 的 BASE），子路径与根路径都能用
    location = /hawb { return 301 /hawb/; }
    location /hawb/ {
        client_max_body_size 40m;          # 上传分单上限（服务端另有 UPLOAD_MAX_MB=30 的限制）
        proxy_pass http://127.0.0.1:8020/; # 末尾斜杠：剥掉 /hawb/ 前缀再交给后端
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;           # 提取是同步调用：慢模型单票要数分钟，按默认 60s 会被掐断
    }
    # 裸根路径直接落审核台：只输 IP 也能用（302 故意不用 301——浏览器会把 301 永久缓存，想撤很麻烦）
    location = / { return 302 /hawb/; }
