<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主分单审核台 · 票面浏览 / 航空口径</title>
<link rel="stylesheet" href="web/css/tokens.css">
<link rel="stylesheet" href="web/css/desk.css">
</head>
<body>

<header class="hdr">
  <h1>主分单审核台 · 制单台<span class="ver" id="verTag" title="当前服务端版本"></span></h1>
  <span class="svc"><span class="dot" id="svcDot" aria-hidden="true"></span><span id="svcTxt">正在连接提取服务…</span></span>
  <span class="sp"></span>
  <label class="f" id="fModel" title="分单（HAWB）提取用的模型：下拉即切换，选择会写回服务端 .env（重启后、批处理也沿用）。视觉模型才能处理扫描件；纯文本模型只吃电子单/文字层 PDF">
    分单模型<select id="modelSel"></select></label>
  <label class="f" id="fModelM" title="主单（MAWB）提取用的模型，和分单各切各的。主单资料是几百字符的纯文本、没有票面图，2026-09-29 实测同一条 S2 取到 2/36 列、qwen3.8-flash 取到 18/36 列。切换后已缓存的主单解析结果按新模型自动重算">
    主单模型<select id="modelSelM"></select></label>
  <label class="f">复核人<input id="reviewer" type="text" placeholder="制单员姓名" size="10"></label>
  <label class="f" title="勾选后原件与结果一并落盘留档（L0 原件归档 / L1 转录 / L2 / L3 / 质检记录）。不勾选则不落盘，离开本页后也无法再回看票面">
    <input type="checkbox" id="doSave" checked>落盘留档</label>
  <span class="f" id="whoWrap" hidden><span class="who" id="whoName"></span><span class="role" id="whoRole"></span><button class="pwwarn" id="pwWarn" type="button" hidden title="管理员口令还是出厂默认值：登录门禁等于没上，点这里去「账号管理」改掉">口令未改</button></span>
  <span class="seg" role="tablist" aria-label="视图切换">
    <button class="btn sm on" id="viewDesk" type="button" role="tab" aria-selected="true">核对工作台</button>
    <button class="btn sm" id="viewDay" type="button" role="tab" aria-selected="false">今日台账</button>
  </span>
  <button class="btn sm" id="btnMawb" hidden title="跳到本页的「主单检索 · 公司系统」卡片：按主单号取回主单原生资料与名下分单，并可开主单/分单原件">主单检索</button>
  <button class="btn sm" id="btnAcct" hidden>账号管理</button>
  <button class="btn sm gh" id="btnLogout" hidden>退出</button>
</header>

<div class="gate" id="gate">
  <div class="card login">
    <div class="t">主分单审核台 · 登录</div>
    <div class="body">
      <form id="loginForm" autocomplete="on">
        <label class="lf">账号<input id="lgName" type="text" autocomplete="username" placeholder="管理员 admin / 制单员姓名"></label>
        <label class="lf">密码<input id="lgPass" type="password" autocomplete="current-password" placeholder="口令"></label>
        <div class="lgerr" id="lgErr" role="status" aria-live="polite" hidden></div>
        <button class="btn pri lgbtn" id="lgBtn" type="submit">登录</button>
      </form>
      <div class="lghint">制单员口令请在「账号管理」里下发。</div>
    </div>
  </div>
</div>

<div class="gate" id="acct" hidden>
  <div class="card acctbox">
    <div class="t">账号管理<span class="sp"></span><button class="btn sm gh" id="acctClose">关闭</button></div>
    <div class="acctlist" id="acctList"></div>
    <div class="acctadd">
      <input id="acName" type="text" aria-label="账号名" placeholder="账号名（姓名，或已存在账号名以重置口令/改角色）">
      <input id="acPass" type="text" aria-label="新口令" placeholder="新口令（≥6 位；留空=只改角色/占位）" autocomplete="new-password">
      <select id="acRole" aria-label="角色" title="角色">
        <option value="reviewer">制单员</option>
        <option value="inputter">录入员</option>
        <option value="admin">管理员</option>
      </select>
      <button class="btn sm pri" id="acAdd">保存</button>
    </div>
    <div class="lgerr" id="acctErr" role="status" aria-live="polite" hidden></div>
    <div class="lghint">制单员：上传、看票面、核字段、提交。只有管理员能切模型与管账号。改自己的口令：上方填 admin + 新口令保存。</div>
  </div>
</div>

<div class="wrap" id="wrap">
  <nav class="rail" id="rail" aria-label="票据状态窄轨">
    <button class="btn sm railBtn" id="railExpand" type="button" aria-expanded="false" title="展开/收起票据列表（点状态点直接换票）">≡</button>
    <div class="railPrg" id="railPrg" title="本机今天：已提交 / 经手">—</div>
    <div class="railDots" id="railDots"></div>
  </nav>
  <div id="side">
    <section class="card">
      <div class="t">上传分单<span class="sp"></span><span class="n" id="cnt">0 票</span></div>
      <div class="drop" id="drop">
        <b>拖入分单</b>
        图片 / PDF / Excel
        <div class="btns"><button class="btn pri" id="pick">选择文件</button></div>
      </div>
      <input type="file" id="file" multiple hidden accept=".png,.jpg,.jpeg,.bmp,.tif,.tiff,.pdf,.xlsx,.xlsm,.xls">
      <div class="list" id="list" role="group" aria-label="待核对的分单"><div class="empty">尚无票据。</div></div>
    </section>
    <section class="card stack">
      <div class="t">主单检索 · 公司系统<span class="sp"></span><span class="hint" id="mstStatus" role="status" aria-live="polite"></span></div>
      <div class="f mstbar">
        <input id="mstNo" type="text" aria-label="主单号" placeholder="主单号，如 235-96146363" size="18">
        <button class="btn sm pri" id="mstGo">检索</button>
      </div>
      <div class="hint">按主单号取回主单资料并自动解析，名下分单列在页面底部。</div>
      <div id="mstResult"></div>
    </section>
    <section class="card stack">
      <div class="t">本地暂存<span class="sp"></span><button class="btn sm gh" id="clearDrafts">清空</button></div>
      <div class="list compact" id="drafts" role="group" aria-label="本机暂存的编辑"></div>
    </section>
  </div>

  <section id="view">
    <div class="t">票面浏览<span class="sp"></span><span class="pvname" id="pvName"></span></div>
    <div class="pvtools" id="pvTools" hidden>
      <span id="pvZoom" hidden>
        <button class="btn sm" id="pvOut" title="缩小">−</button>
        <span class="hint" id="pvZoomTxt">100%</span>
        <button class="btn sm" id="pvIn" title="放大">+</button>
        <button class="btn sm" id="pvFit">适应宽度</button>
      </span>
      <span id="pvPdf" hidden>
        <button class="btn sm" id="pvPage" title="按 整页看全 → 适应宽度 → 放大看细节 循环；某一档和当前看起来一样时不出现"></button>
      </span>
      <span id="pvLoc" hidden>
        <span class="hint">定位模式</span>
        <button class="btn sm" id="pvLocPrev" title="上一页">‹</button>
        <span class="hint" id="pvLocPage"></span>
        <button class="btn sm" id="pvLocNext" title="下一页">›</button>
        <button class="btn sm" id="pvLocExit" title="回到正常票面浏览">返回原视图</button>
      </span>
      <span class="sp"></span>
      <button class="btn sm" id="pvNew">新窗口</button>
      <button class="btn sm" id="pvDl">下载原件</button>
    </div>
    <div class="pv" id="pvBody">
      <div class="empty">上传分单后显示票面。</div>
    </div>
  </section>

  <section id="main">
    <div class="empty empty-hero">上传分单后在这里逐字段核对。</div>
  </section>
</div>

<section class="stack" id="mstHawbCard" hidden>
  <div class="t">名下分单<span class="sp"></span><span class="n" id="mstHawbCnt"></span></div>
  <div id="mstHawbBox"></div>
</section>

<section class="stack" id="dayCard" hidden>
  <div class="t">今日台账<span class="sp"></span>
    <label class="f">日期<input id="dayDate" type="date" aria-label="台账日期"></label>
    <button class="btn sm" id="dayGo" type="button">刷新</button>
    <span class="n" id="dayCnt"></span></div>
  <div id="dayBox"></div>
</section>

<div id="toasts" aria-live="polite"></div>

<script src="web/js/logic.js"></script>
<script src="web/js/desk.js"></script>
</body>
</html>
